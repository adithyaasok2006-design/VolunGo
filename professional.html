<!DOCTYPE html>
<html>
<head>
    <title>Professional Organization Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="header">
    <h1>VolunGo</h1>
    <p>Professional Organization Dashboard</p>
</div>

<div class="container">

    <h2>Post New Event</h2>

    <form id="eventForm">
        <input type="text" id="eventName" placeholder="Event Name" required><br><br>
        <input type="text" id="location" placeholder="Location" required><br><br>
        <input type="date" id="date" required><br><br>
        <textarea id="skills" placeholder="Skills Required (separate by commas)" required></textarea>

        <button type="submit">Post Event</button>
    </form>

    <hr><br>

    <h2>Posted Events</h2>
    <div id="eventList"></div>

    <hr><br>

    <h2>Volunteer Applications</h2>

    <table border="1" width="100%">
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Skills</th>
            <th>Action</th>
        </tr>

        <tr>
            <td>Aisha</td>
            <td>aisha@email.com</td>
            <td>Teaching</td>
            <td>
                <button onclick="acceptVolunteer(this)">Accept</button>
                <button onclick="rejectVolunteer(this)">Reject</button>
            </td>
        </tr>

        <tr>
            <td>Rahul</td>
            <td>rahul@email.com</td>
            <td>Cleaning</td>
            <td>
                <button onclick="acceptVolunteer(this)">Accept</button>
                <button onclick="rejectVolunteer(this)">Reject</button>
            </td>
        </tr>
    </table>

</div>

<script src="script.js"></script>
</body>
</html>
