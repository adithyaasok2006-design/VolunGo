    <h1>VolunGo</h1>

<div class="container">


<h1>Post an Opportunity</h1>

<form>
    <label>Organization Name:</label><br>
    <input type="text" required><br><br>

    <label>Opportunity Title:</label><br>
    <input type="text" required><br><br>

    <label>Category:</label><br>
    <select>
        <option>Social Impact</option>
        <option>Skill-Based</option>
        <option>Campus</option>
    </select><br><br>

    <label>Required Skills:</label><br>
    <input type="text" placeholder="Communication, Leadership"><br><br>

    <label>Hours Required:</label><br>
    <input type="number"><br><br>

    <button type="button" onclick="postOpportunity()">Post Opportunity</button>
</form>

<script src="script.js"></script>

</body>
